<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Git It! settings</title>
  <style>
    body { font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #1f2328; }
    h1 { font-size: 22px; }
    label { display: block; font-weight: 600; margin-top: 16px; }
    .hint { color: #59636e; font-size: 12px; margin: 2px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; border: 1px solid #d1d9e0; border-radius: 6px; }
    button { margin-top: 20px; padding: 6px 16px; font: inherit; font-weight: 600; color: #fff; background: #2da44e; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: progress; }
    #result { margin-top: 16px; min-height: 1.5em; }
    .ok { color: #1a7f37; }
    .err { color: #cf222e; }
  </style>
</head>
<body>
  <h1>Git It! settings</h1>
  <p>
    Git It! saves repos to <code>hits.json</code> in a private repo you own.
    Create a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">fine-grained token</a>
    with access to that repo only and <strong>Contents: Read and write</strong>.
  </p>
  <form id="form">
    <label for="token">GitHub token</label>
    <p class="hint" id="token-hint">Stored only in this browser profile.</p>
    <input id="token" type="password" autocomplete="off" spellcheck="false" aria-describedby="token-hint">

    <label for="owner">Owner</label>
    <p class="hint" id="owner-hint">Leave blank to use the token's account.</p>
    <input id="owner" type="text" autocomplete="off" spellcheck="false" aria-describedby="owner-hint">

    <label for="repo">Bookmarks repo</label>
    <input id="repo" type="text" autocomplete="off" spellcheck="false" placeholder="my-gits">

    <button type="submit" id="save">Test and save</button>
  </form>
  <div id="result" role="status" aria-live="polite"></div>
  <script src="options.js" type="module"></script>
</body>
</html>
